# Servicio Railway Cron — reemplaza a `worker`, `beat` y `Redis`.
# Arranca, corre las tareas de eBay, y se apaga. Solo factura los segundos
# que tarda cada corrida.
#
# Despierta cada 5 min (mínimo de Railway Cron). En cada tick el comando decide:
# - Notificador (Deal Watcher): se pacéa con el presupuesto diario repartido en
#   la franja activa (hora Colombia); la mayoría de ticks son skips rápidos.
# - Precios Bajo Pedido: gated a 3x/día, primer tick de las horas 00/12/18 UTC.
[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py correr_tareas_programadas --cron-frecuente"
# Cada 5 minutos (el mínimo que permite Railway Cron).
cronSchedule = "*/5 * * * *"
# El servicio NO debe reiniciarse al terminar: un cron termina y se apaga.
restartPolicyType = "never"
